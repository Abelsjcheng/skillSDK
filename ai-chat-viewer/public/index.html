<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>AI Chat Viewer</title>
  <style>
    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    * {
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div id="root" class="weagentCUI"></div>
  <script>
    window.HWH5?.addEventListener?.({
      type: 'onVisible',
      func: (payload) => {
        window.agentskills_onVisible = payload; // 冷启动首次加载的onVisible回调存入缓存
        window.dispatchEvent(new CustomEvent('agentskills_onVisible', {
          detail: payload
        }));
      },
    });
  </script>
</body>
</html>
